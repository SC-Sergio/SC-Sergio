name: Generate profile contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches:
      - profile-redesign-v2
    paths:
      - ".github/workflows/profile-snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F2A6C6&color_dots=#EBEDF0,#7DD3FC,#D8B4FE,#F2A6C6,#FFFFFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F2A6C6&color_dots=#161B22,#7DD3FC,#D8B4FE,#F2A6C6,#FFFFFF

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
