name: Generate self-hosted profile activity cards

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Render self-hosted contribution cards
        uses: seijikohara/profile-cards-action@927628661ecc21fba94cab7a96b63a4a1604382d
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: SC-Sergio
          cards: contributions
          output-dir: profile-assets
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh self-hosted activity card [skip ci]"
