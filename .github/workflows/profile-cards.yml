name: Generate self-hosted profile activity cards

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches:
      - profile-redesign-v2
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Render self-hosted contribution cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: SC-Sergio
          cards: contributions
          output-dir: profile-assets
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh self-hosted activity card [skip ci]"
