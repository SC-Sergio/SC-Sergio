name: Prepare Mahiro hero candidates

on:
  push:
    branches:
      - profile-redesign-v2

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: profile-redesign-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Optimize and organize hero candidates
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          candidates = [
              (Path('new imagen mahiro.png'), Path('images/hero-mahiro-tech-dark-a.webp')),
              (Path('new mahiro 2.png'), Path('images/hero-mahiro-tech-dark-b.webp')),
          ]

          for src, dst in candidates:
              if not src.exists():
                  raise SystemExit(f'Missing uploaded candidate: {src}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(src) as image:
                  image.convert('RGB').save(dst, 'WEBP', quality=90, method=6)
              print(f'{src} -> {dst}')

      - name: Activate candidate A in all profile READMEs
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'README.md': 'Hero Mahiro Tech de Sergio Carey',
              'README.en.md': 'Sergio Carey Mahiro Tech hero',
              'README.pt-BR.md': 'Hero Mahiro Tech de Sergio Carey',
          }

          old = '<img src="./images/bg.webp" width="100%"'
          for filename, alt in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected current hero not found in {filename}')
              text = text.replace(
                  old,
                  '<img src="./images/hero-mahiro-tech-dark-a.webp" width="100%"',
                  1,
              )
              path.write_text(text, encoding='utf-8')

      - name: Remove temporary root uploads
        run: |
          git rm "new imagen mahiro.png" "new mahiro 2.png"

      - name: Commit prepared candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md README.pt-BR.md images/hero-mahiro-tech-dark-a.webp images/hero-mahiro-tech-dark-b.webp
          git commit -m "feat(profile): integrate Mahiro Tech hero candidates [skip ci]"
          git push origin HEAD:profile-redesign-v2
